<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سوق الأصول</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="icon-512.png">
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f5f5f7;color:#111}
header{background:#4f46e5;color:#fff;padding:16px}
header h2{margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
input{width:100%;padding:10px;border-radius:8px;border:0;margin-top:8px;box-sizing:border-box;font-size:16px}
#cats{display:flex;gap:8px;overflow-x:auto;padding:12px}
.chip{padding:8px 14px;background:#fff;border:1px solid #ddd;border-radius:20px;white-space:nowrap;cursor:pointer}
.chip.on{background:#4f46e5;color:#fff}
#list{padding:0 12px 24px;display:grid;gap:10px}
.card{background:#fff;border-radius:12px;padding:14px}
.card h3{margin:0 0 6px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.heart{background:none;border:0;font-size:24px;cursor:pointer;padding:0;line-height:1}
.price{color:#4f46e5;font-weight:bold;margin-top:6px}
.btn{padding:10px 14px;border:0;border-radius:8px;background:#4f46e5;color:#fff;font-size:15px;cursor:pointer;width:100%;margin-top:8px}
.btn.light{background:#fff;color:#4f46e5;width:auto;margin:0;padding:8px 14px}
.btn.alt{background:#10b981}
.btn.ghost{background:#eee;color:#333}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.box{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:380px}
.box h3{margin:0}
.box input{border:1px solid #ddd;margin-top:10px}
#msg{margin-top:8px;font-size:14px;color:#b91c1c;min-height:18px}
</style>
</head>
<body>
<header>
  <div class="top">
    <h2>🛒 سوق الأصول الرقمية</h2>
    <button id="authBtn" class="btn light">دخول</button>
  </div>
  <input id="q" placeholder="ابحث عن قالب أو أيقونات...">
</header>
<div id="cats"></div>
<div id="list"></div>

<div id="modal" class="modal" hidden>
  <div class="box">
    <h3>حسابك</h3>
    <input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email">
    <input id="pass" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)" autocomplete="current-password">
    <div id="msg"></div>
    <button id="loginBtn" class="btn">تسجيل الدخول</button>
    <button id="signupBtn" class="btn alt">إنشاء حساب جديد</button>
    <button id="closeBtn" class="btn ghost">إغلاق</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const db = supabase.createClient(
  'https://lzokcvfbbyshowujewfd.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6b2tjdmZiYnlzaG93dWpld2ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0OTk3MzQsImV4cCI6MjExMDA3NTczNH0._AUiEWtMrq9c_9v_8j1pIZeLyNIWaYVaFaujW80LFss'
);
const $ = id => document.getElementById(id);
let cat = null, q = '', user = null, favs = new Set(), onlyFavs = false;

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}

function showModal(text){ $('msg').textContent = text || ''; $('modal').hidden = false; }
function hideModal(){ $('modal').hidden = true; }

function pick(id, node, fav){
  if (fav && !user){ showModal('سجّل الدخول لعرض مفضلتك'); return; }
  cat = id; onlyFavs = !!fav;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  node.classList.add('on');
  loadAssets();
}

async function loadCats(){
  const { data } = await db.from('categories').select('*');
  const box = $('cats');
  box.innerHTML = '';
  const all = el('div', 'chip on', 'الكل');
  all.onclick = () => pick(null, all, false);
  box.append(all);
  const fv = el('div', 'chip', '❤️ مفضلتي');
  fv.onclick = () => pick(null, fv, true);
  box.append(fv);
  (data || []).forEach(c => {
    const chip = el('div', 'chip', c.icon + ' ' + c.name);
    chip.onclick = () => pick(c.id, chip, false);
    box.append(chip);
  });
}

async function loadFavs(){
  favs = new Set();
  if (!user) return;
  const { data } = await db.from('favorites').select('asset_id');
  (data || []).forEach(r => favs.add(r.asset_id));
}

async function toggleFav(id){
  if (!user){ showModal('سجّل الدخول لإضافة المفضلة'); return; }
  if (favs.has(id)){
    const { error } = await db.from('favorites').delete().eq('asset_id', id).eq('user_id', user.id);
    if (!error) favs.delete(id);
  } else {
    const { error } = await db.from('favorites').insert({ asset_id: id });
    if (!error) favs.add(id);
  }
  loadAssets();
}

async function loadAssets(){
  const list = $('list');
  list.innerHTML = '';
  let query = db.from('assets').select('*').order('created_at', { ascending: false });
  if (cat) query = query.eq('category_id', cat);
  if (q) query = query.ilike('title', '%' + q + '%');
  if (onlyFavs){
    if (!favs.size){ list.append(el('div', 'card', 'لا توجد أصول في مفضلتك بعد')); return; }
    query = query.in('id', [...favs]);
  }
  const { data, error } = await query;
  list.innerHTML = '';
  if (error){ list.append(el('div', 'card', 'خطأ: ' + error.message)); return; }
  if (!data.length){ list.append(el('div', 'card', 'لا توجد نتائج')); return; }
  data.forEach(a => {
    const card = el('div', 'card');
    const row = el('div', 'row');
    row.append(el('h3', '', a.title));
    const heart = el('button', 'heart', favs.has(a.id) ? '❤️' : '🤍');
    heart.onclick = () => toggleFav(a.id);
    row.append(heart);
    card.append(row);
    card.append(el('div', '', a.description || ''));
    card.append(el('div', 'price', a.price > 0 ? a.price + '$' : 'مجاني'));
    list.append(card);
  });
}

async function refreshUser(){
  const { data } = await db.auth.getSession();
  user = data.session ? data.session.user : null;
  $('authBtn').textContent = user ? 'خروج' : 'دخول';
  await loadFavs();
  loadAssets();
}

async function doAuth(kind){
  const email = $('email').value.trim();
  const password = $('pass').value;
  if (!email || password.length < 6){
    $('msg').textContent = 'أدخل بريداً صحيحاً وكلمة مرور 6 أحرف على الأقل';
    return;
  }
  $('msg').textContent = 'جارٍ التنفيذ...';
  const res = kind === 'login'
    ? await db.auth.signInWithPassword({ email, password })
    : await db.auth.signUp({ email, password });
  if (res.error){ $('msg').textContent = 'خطأ: ' + res.error.message; return; }
  if (kind === 'signup' && !res.data.session){
    $('msg').textContent = 'تم إنشاء الحساب. افحص بريدك لتأكيده ثم سجّل الدخول.';
    return;
  }
  hideModal();
}

$('authBtn').onclick = async () => {
  if (user){ await db.auth.signOut(); location.reload(); }
  else showModal('');
};
$('loginBtn').onclick = () => doAuth('login');
$('signupBtn').onclick = () => doAuth('signup');
$('closeBtn').onclick = hideModal;
$('q').oninput = e => { q = e.target.value; loadAssets(); };
db.auth.onAuthStateChange(() => refreshUser());

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
loadCats();
refreshUser();
</script>
</body>
</html>
